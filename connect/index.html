<body class="try-instrument is-connect">
  <!-- Arrival: a luminous veil that dissolves on load — you cross a threshold -->
  <div class="enter-veil" aria-hidden="true"></div>
  <!-- Layer 1: the sky (fixed, scroll-interpolated gradient) -->
  <div class="sky" aria-hidden="true"></div>
  <!-- Layer 2: the stars (fixed canvas, fades in near the night section) -->
  <canvas class="stars" aria-hidden="true"></canvas>
  <!-- Layer 2b: glowing horizon light-band (intensifies into the night) -->
  <div class="horizon" aria-hidden="true"></div>
  <!-- Ambient celestial dust across the whole site -->
  <canvas class="motes" aria-hidden="true"></canvas>
  <!-- The projector's lamp, following the pointer (cursor.js). Two layers:
       a warm bloom that reads on the bright sky, a cool one that reads on the
       dark. Each has to be its own element — a blend mode on a child would be
       trapped inside the parent's stacking context. -->
  <div class="lamp lamp--warm" aria-hidden="true"></div>
  <div class="lamp lamp--cool" aria-hidden="true"></div>
  <!-- Portal edge vignette -->
  <div class="vignette" aria-hidden="true"></div>
  <!-- Warm light leaks drifting at the edges -->
  <div class="leaks" aria-hidden="true"></div>
  <!-- Dust specks & hairline scratches on the negative -->
  <div class="dust" aria-hidden="true"></div>
  <!-- Faint vertical frame lines, as if the frame were projected onto the page -->
  <div class="framelines" aria-hidden="true"></div>
  <!-- Film grain over everything -->
  <div class="grain" aria-hidden="true"></div>
  <!-- The projector's own unsteady lamp -->
  <div class="flicker" aria-hidden="true"></div>

  <!-- Torn-paper filters: turbulence chews the straight edges into fibres -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="torn-edge" x="-8%" y="-30%" width="116%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.09" numOctaves="4" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="torn-rule" x="-4%" y="-220%" width="108%" height="540%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.4" numOctaves="3" seed="4" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- Navigation -->
  <header class="nav">
    <a class="nav__name" href="../">Erin Northcott</a>
    <nav class="nav__links" aria-label="Sections">

      <a class="nav__link" href="../book/">Book</a>
      <a class="nav__link nav__link--here" href="./" aria-current="page">Connect</a>
    </nav>
  </header>

  <main class="page">

    <section class="section section--connect" id="connect">
      <div class="connect__inner">

        <div class="connect__intro reveal">
          <p class="eyebrow">Reel 03 &mdash; Connect</p>
          <h1 class="section__title">I&rsquo;d love to hear from you</h1>
        </div>

        <form class="connect__form reveal" id="connect-form" method="POST" action="https://api.web3forms.com/submit" novalidate>
          <!-- Erin's own Web3Forms key, in from 2026-10-26: enquiries now
               reach her directly, not natalielisa.com's inbox. -->
          <input type="hidden" name="access_key" value="a1bf326f-9cbc-412e-918e-572676abcce6" />
          <input type="hidden" name="subject" value="New enquiry from erinnorthcott" />
          <input type="hidden" name="from_name" value="Erin Northcott — site" />
          <input type="checkbox" name="botcheck" class="connect__botcheck" tabindex="-1" autocomplete="off" />

          <p class="connect__field">
            <label class="connect__label" for="cf-name">Your name</label>
            <input class="connect__input" id="cf-name" name="name" type="text" autocomplete="name" maxlength="120" required />
          </p>

          <p class="connect__field">
            <label class="connect__label" for="cf-email">Email</label>
            <input class="connect__input" id="cf-email" name="email" type="email" autocomplete="email" maxlength="180" required />
          </p>

          <p class="connect__field">
            <label class="connect__label" for="cf-message">Your Message</label>
            <textarea class="connect__input connect__input--area" id="cf-message" name="message" rows="6" maxlength="4000" required></textarea>
          </p>

          <button class="btn-enter connect__send" type="submit">Send</button>

          <p class="connect__note" id="connect-note" role="status" aria-live="polite"></p>
        </form>

      </div>
    </section>

  </main>

            <a class="footer__social" href="https://www.facebook.com/DanielNorthcottDocumentary/" target="_blank" rel="noopener" aria-label="Daniel Northcott Documentary on Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg></a>
          </div>
        </div>
