<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Erin Northcott">
  <!-- FAVICON (2026-10-28, hers): "a favicon for erins site. a pink circle",
       then "can we try a rose?", "i want it to be pink too", "and simple", then
       "i want the spiral to be a bit bigger, right now its small, use the full
       width of the square".

       A rose read down to 16px is a spiral and nothing else: her own gold
       line-art rose was tried first and does not survive the size. Six
       variants were previewed at 16/32/64/180 and she took the spiral alone,
       on no disc, in the site pink.

       An inward spiral is NOT symmetric about its own centre: it starts at
       angle 0 at full radius and winds in, so the raw path sat 3px down and
       right of the middle. These coordinates are the path measured, centred on
       its own painted bounding box (stroke included) and scaled so the long
       axis touches both edges. Do not "simplify" this back to a centred arc
       formula; it will drift off-centre again. -->
